project:
  type: website
  output-dir: _site

website:
  title: "Luis Blanco"
  site-url: "https://luisblancohoyos.com"
  description: "Notes and experiments in machine learning"
  navbar:
    right:
      - text: "ES"
        href: /es/
  draft-mode: unlinked
  search: false

format:
  html:
    include-after-body: lang-toggle.html
    theme:
      light: [litera, theme-light.scss]
      dark: [litera, theme-dark.scss]
    respect-user-color-scheme: true
    toc: false
    title-block-banner: false
    highlight-style:
      light: arrow-light
      dark: arrow-dark

execute:
  freeze: auto